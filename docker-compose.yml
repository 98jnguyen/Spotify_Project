version: "3.8"


services:
  db:
    image: postgres:13
    container_name: postgres_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5000:5000"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  app:
    build:
      context: ./app
      dockerfile: dockerfile
      container_name: main_app
      depends_on:
        - db
      environment:
        - xxx
      ports:
         - "8080:8080"
      networks:
        - app-network


volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge